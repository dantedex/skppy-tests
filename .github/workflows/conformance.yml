name: Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Check out skppy
        uses: actions/checkout@v6
        with:
          repository: dantedex/skppy
          path: skppy
          # Fine-grained PAT with Contents: Read when skppy is private.
          token: ${{ secrets.SKPPY_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skppy/pyproject.toml

      - name: Install Python test dependencies
        run: pip install -e ./skppy pytest

      - name: Run Python tests
        run: python -m pytest -q

  sdk:
    name: Public SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out skppy
        uses: actions/checkout@v6
        with:
          repository: dantedex/skppy
          path: skppy
          # Fine-grained PAT with Contents: Read when skppy is private.
          token: ${{ secrets.SKPPY_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: skppy/pyproject.toml

      - name: Install Python test dependencies
        run: pip install -e ./skppy pytest

      - name: Install public SDK test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64 wine

      - name: Generate and validate current parser fixtures
        run: |
          make generate OUTPUT_DIR="${RUNNER_TEMP}/skppy-tests-current"
          OUTPUT_DIR="${RUNNER_TEMP}/skppy-tests-current" python run_tests.py

      - name: Validate every supported public save target
        run: >-
          make release-matrix
          SKPPY_PATH="${GITHUB_WORKSPACE}/skppy"
          OUTPUT_DIR="${RUNNER_TEMP}/skppy-tests-matrix"
          MATRIX_JOBS=4

      - name: Validate modern writer output through the public SDK
        run: >-
          make writer-validation
          SKPPY_PATH="${GITHUB_WORKSPACE}/skppy"
          OUTPUT_DIR="${RUNNER_TEMP}/skppy-tests-writer"

      - name: Validate SketchUp Make 2017 writer output through the public SDK
        run: >-
          make legacy-writer-validation
          SKPPY_PATH="${GITHUB_WORKSPACE}/skppy"
          OUTPUT_DIR="${RUNNER_TEMP}/skppy-tests-legacy-writer"
